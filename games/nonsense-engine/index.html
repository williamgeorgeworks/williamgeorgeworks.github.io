<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171b21">
  <meta name="description" content="One ticket. Eleven passengers. A seaside roguelike deckbuilder from William George Works.">
  <title>The Nonsense Engine · William George Works Arcade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%231b1b23'/%3E%3Cpath fill='%23ffe058' d='m22 2-14 22h10l-2 15 17-24H22z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <a class="skip" href="#handTitle">Go to cards</a>
  <main id="cabinet">
    <header class="mast">
      <div class="lockup"><span class="brand-mark" aria-hidden="true"><i data-icon="bolt"></i></span><div><div class="maker">William George Works <span> / </span> Arcade</div><h1>The Nonsense Engine</h1></div></div>
      <nav class="toolbox" aria-label="Game controls">
        <span id="inkTotal" class="ink-stat" title="Ink to spend at pier services"></span>
        <button class="iconbtn" data-action="map" title="Run map" aria-label="Run map"><i data-icon="map"></i></button>
        <button class="iconbtn" data-action="sound" id="soundButton" title="Sound settings" aria-label="Sound settings"><i data-icon="volume"></i></button>
        <button class="iconbtn" data-action="menu" title="Game menu" aria-label="Game menu"><i data-icon="menu"></i></button>
      </nav>
    </header>
    <div class="playmat">
      <section id="stage" class="stage" aria-label="Battle arena">
        <div class="scenery" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
        <div class="stage-hud"><div class="venue"><span id="actLabel" class="stage-kicker"></span><h2 id="venueName"></h2></div><span id="turnLabel" class="turn-tag"></span></div>
        <div id="duellists"></div><div id="impact" aria-hidden="true"></div><div id="battleFlash" aria-hidden="true"></div>
        <div class="arena-edge" aria-hidden="true"></div>
      </section>
      <section class="table-area" id="tableArea" aria-label="Play area"></section>
    </div>
    <footer><span class="credits"><i data-icon="star"></i> The Quill Family Arcade</span><div><button data-action="help"><i data-icon="help"></i> How to play</button><span class="foot-rule"></span><button data-action="log"><i data-icon="log"></i> Case log</button></div></footer>
  </main>
  <div id="overlay" hidden></div><div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript>This card game needs JavaScript to play.</noscript>
  <script src="engine.js"></script><script src="audio.js"></script><script src="ui.js"></script>
</body></html>
