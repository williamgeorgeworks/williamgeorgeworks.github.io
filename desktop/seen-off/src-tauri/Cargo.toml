[package]
name = "seen-off"
version = "0.1.0"
description = "Seen Off - a card game of doubtful magic (desktop build)"
authors = ["William George Works"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "seen_off_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
