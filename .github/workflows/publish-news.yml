name: Publish Daily Row
on:
  push:
    branches: ['news/**']
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the edition
        run: node tools/check-news.js
      - name: Merge into main
        run: |
          git config user.name "Reginald Quill"
          git config user.email "noreply@anthropic.com"
          git checkout main
          git pull --ff-only origin main
          git merge --no-edit "origin/${GITHUB_REF_NAME}" -m "Publish ${GITHUB_REF_NAME} (automatic, checker passed)"
          git push origin main
      - name: Refresh RSS feeds
        run: |
          node tools/make-feeds.js
          node tools/make-sitemap.js
          git add news.xml gaming.xml sitemap.xml
          git diff --cached --quiet || (git commit -m "Refresh RSS feeds (automatic)" && git push origin main)
      - name: Ask Pages to rebuild
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
